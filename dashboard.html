<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - LARRY EARN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h2>💰 LARRY EARN</h2>
<h3 id="welcome">Welcome!</h3>
<button onclick="logout()">Logout</button>
</header>

<section class="balance">
<h2>My Wallet</h2>
<h1 id="balance">$0.00</h1>
<p>Minimum withdrawal: $5</p>
</section>

<section>
<h2>Available Tasks</h2>
<p>📺 Watch Advert — Coming Soon</p>
<p>⭐ Special Advert — Coming Soon</p>
<p>📋 Complete Tasks — Coming Soon</p>
</section>

<section class="withdraw">
<h2>Withdraw Money</h2>
<p>OPay | PalmPay | Nigerian Banks</p>
<p>Withdrawal requests are not active yet.</p>
</section>

<script>
const user = JSON.parse(localStorage.getItem("currentUser"));

if (!user) {
  window.location.href = "login.html";
} else {
  document.getElementById("welcome").textContent =
    "Welcome, " + user.name;
}

function logout() {
  localStorage.removeItem("currentUser");
  window.location.href = "login.html";
}
</script>

</body>
</html>
