<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LARRY EARN Dashboard</title>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0}
header{background:#087b45;color:white;padding:20px;text-align:center}
.container{padding:20px}
.card{background:white;padding:20px;margin:15px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
.balance{font-size:30px;color:#087b45;font-weight:bold}
button{background:#087b45;color:white;border:0;padding:12px;border-radius:7px;width:100%;margin-top:10px}
</style>
</head>
<body>

<header>
<h2>💰 LARRY EARN</h2>
<p>My Earning Dashboard</p>
</header>

<div class="container">
<div class="card">
<h3>Welcome, <span id="username">User</span></h3>
<p>Available Balance</p>
<div class="balance">₦<span id="balance">0.00</span></div>
<p>Points: <span id="points">0</span></p>
</div>

<div class="card">
<h3>Available Tasks</h3>
<p>Complete available tasks to earn rewards.</p>
<button onclick="alert('Tasks will appear here when added.')">View Tasks</button>
</div>

<div class="card">
<h3>Withdraw Money</h3>
<p>Request withdrawal of your approved earnings.</p>
<button onclick="alert('Withdrawal feature is coming soon.')">Request Withdrawal</button>
</div>

<button onclick="logout()">Logout</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient(
"PASTE_YOUR_PROJECT_URL_HERE",https://naeukrdjudacqvcauocy.supabase.co
"PASTE_YOUR_PUBLISHABLE_KEY_HERE"sb_publishable_J45KIA6VWq9UUX1R9U5qhg_hYh1eTms
);

async function loadDashboard(){
const {data:{user},error} = await supabaseClient.auth.getUser();

if(error || !user){
window.location.href="login.html";
return;
}

document.getElementById("username").textContent =
user.user_metadata.full_name || user.email;

const {data,error:profileError} = await supabaseClient
.from("profiles")
.select("balance,points")
.eq("id",user.id)
.single();

if(data){
document.getElementById("balance").textContent =
Number(data.balance).toFixed(2);
document.getElementById("points").textContent = data.points;
}
}

async function logout(){
await supabaseClient.auth.signOut();
window.location.href="login.html";
}

loadDashboard();
</script>
</body>
</html>
